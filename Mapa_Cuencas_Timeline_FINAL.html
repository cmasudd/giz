        .rank-badge.top10 { background: #e74c3c; }
        .rank-badge.others { background: #95a5a6; }
        .info-section { margin: 12px 0; }
        .section-title { font-size: 13px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

        .info-label { font-weight: 600; color: #34495e; font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }
        .info-value { color: #2c3e50; font-size: 12px; line-height: 1.4; }
        .score-row { display: flex; justify-content: space-between; margin: 4px 0; padding: 3px 0; font-size: 13px; }
        .score-label { font-weight: 600; color: #34495e; }
        .score-value { font-weight: bold; padding: 2px 8px; border-radius: 3px; background: white; }
        .score-value.high { color: #8e44ad; }
        .score-value.medium { color: #e74c3c; }
        .score-value.low { color: #27ae60; }
        .chart-container { margin: 15px 0; position: relative; height: 220px; }

        .legend-title { font-weight: bold; margin-bottom: 8px; color: #2c3e50; font-size: 12px; }

        const map = L.map('map').setView([-15, -70], 4);
        const basemaps = {
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap, OpenTopoMap', maxZoom: 17 }),
            street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri', maxZoom: 19 })
        };
        basemaps.topo.addTo(map);
        document.querySelectorAll('input[name="basemap"]').forEach(r => r.addEventListener('change', e => {
            Object.values(basemaps).forEach(l => map.removeLayer(l));
            basemaps[e.target.value].addTo(map);
        }));
        
        const cuencasLayer = L.layerGroup().addTo(map);
        const proyectosLayer = L.layerGroup().addTo(map);
        
        document.getElementById('toggleCuencas').addEventListener('click', function() {
            this.classList.toggle('active');
            this.classList.contains('active') ? cuencasLayer.addTo(map) : map.removeLayer(cuencasLayer);
        });
        
        document.getElementById('toggleProyectos').addEventListener('click', function() {
            this.classList.toggle('active');
            this.classList.contains('active') ? proyectosLayer.addTo(map) : map.removeLayer(proyectosLayer);
        });
        
        function getColor(s) { return s >= 2.5 ? '#8e44ad' : s >= 2.0 ? '#e74c3c' : s >= 1.5 ? '#f1c40f' : '#27ae60'; }
        function getStatusColor(s) { return s === 'Operando' ? '#2ecc71' : s === 'En construcción' ? '#f39c12' : s === 'Paralizado' ? '#e74c3c' : '#95a5a6'; }
        function getScoreClass(s) { return s >= 2.5 ? 'high' : s >= 2.0 ? 'medium' : 'low'; }
        function getRankClass(r) { return r <= 3 ? 'top3' : r <= 10 ? 'top10' : 'others'; }
        
        let currentRadarChart = null;
        let currentVariablesChart = null;
        let isPlaying = false;
        let playInterval = null;
        
        cuencasData.forEach(c => {
            const coords = coordenadas[c.cuenca];
            if (!coords) {
                console.warn(`⚠ Sin coordenadas: ${c.cuenca}`);
                return;
            }
            const m = L.circleMarker(coords, {
                radius: 7 + (c.rank <= 10 ? 3 : 0),
                fillColor: getColor(c.score_final),
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            });
            m.bindPopup(`<b>${c.cuenca}</b><br>${c.pais} - ${c.mineral}<br>Score: ${c.score_final.toFixed(2)} | Rank #${c.rank}<br><small><i>Click para detalles</i></small>`);
            m.on('click', () => showCuencaInfo(c));
            m.addTo(cuencasLayer);
        });
        
        let proyectosMarkers = [];
        proyectosData.forEach(p => {
            const m = L.marker(p.coords, {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="width:12px;height:12px;background:${getStatusColor(p.status)};border:2px solid #34495e;transform:rotate(45deg);"></div>`,
                    iconSize: [12, 12],
                    iconAnchor: [6, 6]
                })
            });
            m.bindPopup(`<b>${p.nombre}</b><br>${p.empresa} (${p.año})<br>${p.tipo} - ${p.status}<br>Producción: ${p.produccion}`);
            m.projectYear = p.año;
            m.addTo(proyectosLayer);
            proyectosMarkers.push(m);
        });
        
        const slider = document.getElementById('timelineSlider');
        const yearDisplay = document.getElementById('yearDisplay');
        
        function updateTimeline(y) {
            yearDisplay.textContent = y;
            proyectosMarkers.forEach(m => m.setOpacity(m.projectYear <= y ? 1 : 0.2));
        }
        
        slider.addEventListener('input', e => updateTimeline(parseInt(e.target.value)));
        
        function togglePlay() {
            const btn = document.getElementById('playPauseBtn');
            if (isPlaying) {
                clearInterval(playInterval);
                btn.textContent = '▶ Play';
                isPlaying = false;
            } else {
                btn.textContent = '⏸ Pause';
                isPlaying = true;
                playInterval = setInterval(() => {
                    let y = parseInt(slider.value);
                    y = y >= 2026 ? 1899 : y + 1;
                    slider.value = y;
                    updateTimeline(y);
                }, 300);
            }
        }

                        <div class="info-item">
                            <div class="info-label">Precipitación</div>
                            <div class="info-value">${c.precipitacion}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Estrés Hídrico</div>
                            <div class="info-value">${c.bws} - ${c.wri}</div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <div class="section-title">🌳 AMBIENTE & ECONOMÍA</div>
                        <div class="info-item">
                            <div class="info-label">Áreas Protegidas</div>
                            <div class="info-value">${c.areas_protegidas}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Actividades Económicas</div>
                            <div class="info-value">${c.actividades}</div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <div class="section-title">👥 POBLACIÓN & COMUNIDADES</div>
                        <div class="info-item">
                            <div class="info-label">Población</div>
                            <div class="info-value">${c.poblacion}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Comunidades Indígenas</div>
                            <div class="info-value">${c.comunidades}</div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <div class="section-title">🔧 DATOS DISPONIBLES</div>
                        <div class="info-item">
                            <div class="info-label">Redes de Monitoreo</div>
                            <div class="info-value">${c.redes_monitoreo}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Información</div>
                            <div class="info-value">${c.info_disponible}</div>
                        </div>
                    </div>
                </div>
                
                <div id="scores" class="tab-content">
                    <div style="margin: 12px 0; padding: 10px; background: #ecf0f1; border-radius: 5px;">
                        <div class="score-row"><span class="score-label">Score Final:</span><span class="score-value ${getScoreClass(c.score_final)}">${c.score_final.toFixed(2)}</span></div>
                    </div>
                    <div style="margin: 12px 0; padding: 10px; background: #ecf0f1; border-radius: 5px;">
                        <h4 style="font-size: 12px; color: #2c3e50; margin-bottom: 8px;">Dimensiones</h4>
                        <div class="score-row"><span class="score-label">D1 - Impacto Minero:</span><span class="score-value ${getScoreClass(c.d1_score)}">${c.d1_score.toFixed(2)}</span></div>
                        <div class="score-row"><span class="score-label">D2 - Criticidad Hídrica:</span><span class="score-value ${getScoreClass(c.d2_score)}">${c.d2_score.toFixed(2)}</span></div>
                        <div class="score-row"><span class="score-label">D3 - Vulnerabilidad Social:</span><span class="score-value ${getScoreClass(c.d3_score)}">${c.d3_score.toFixed(2)}</span></div>
                        <div class="score-row"><span class="score-label">D4 - Viabilidad Técnica:</span><span class="score-value ${getScoreClass(c.d4_score)}">${c.d4_score.toFixed(2)}</span></div>
                    </div>
                </div>
                
                <div id="charts" class="tab-content">
                    <h4 style="font-size: 12px; color: #2c3e50; margin: 12px 0 6px 0;">Dimensiones</h4>
                    <div class="chart-container"><canvas id="radarChart"></canvas></div>
                    <h4 style="font-size: 12px; color: #2c3e50; margin: 12px 0 6px 0;">Variables</h4>
                    <div class="chart-container"><canvas id="variablesChart"></canvas></div>
                </div>
            `;
            panel.classList.add('active');
            window.currentCuenca = c;
        }
        
        function createRadarChart(c) {
            const ctx = document.getElementById('radarChart');
            if (!ctx) return;
            if (currentRadarChart) currentRadarChart.destroy();
            currentRadarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['D1:\\nImpacto', 'D2:\\nCriticidad', 'D3:\\nVulnera.', 'D4:\\nViabilidad'],
                    datasets: [{
                        data: [c.d1_score, c.d2_score, c.d3_score, c.d4_score],
                        fill: true,
                        backgroundColor: 'rgba(52,152,219,0.2)',
                        borderColor: 'rgb(52,152,219)',
                        pointBackgroundColor: 'rgb(52,152,219)',
                        pointRadius: 4
                    }]
                },
                options: { scales: { r: { suggestedMin: 0, suggestedMax: 3, ticks: { stepSize: 0.5 }}}, plugins: { legend: { display: false }}}
            });
        }
        
        function createVariablesChart(c) {
            const ctx = document.getElementById('variablesChart');
            if (!ctx) return;
            if (currentVariablesChart) currentVariablesChart.destroy();
            currentVariablesChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Prod%', 'Res%', 'BWS', 'AP', 'Usos', 'Pob', 'Com', 'Info'],
                    datasets: [{
                        data: [c.n11, c.n12, c.n21, c.n22, c.n23, c.n31, c.n32, c.n41],
                        fill: true,
                        backgroundColor: 'rgba(231,76,60,0.2)',
                        borderColor: 'rgb(231,76,60)',
                        pointBackgroundColor: 'rgb(231,76,60)',
                        pointRadius: 4
                    }]
                },
                options: { scales: { r: { suggestedMin: 0, suggestedMax: 3, ticks: { stepSize: 1 }}}, plugins: { legend: { display: false }}}
            });
        }
        
        function closePanel() {
            document.getElementById('infoPanel').classList.remove('active');
        }
        
        function switchTab(event, tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            if (tabName === 'charts' && window.currentCuenca) {
                setTimeout(() => {
                    createRadarChart(window.currentCuenca);
                    createVariablesChart(window.currentCuenca);
                }, 50);
            }
        }
        
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            if (term.length < 2) return;
            const found = cuencasData.find(c => c.cuenca.toLowerCase().includes(term));
            if (found) {
                const coords = coordenadas[found.cuenca];
                if (coords) {
                    map.setView(coords, 8);
                    showCuencaInfo(found);
                }
            }
        });
        
        updateTimeline(2025);
        console.log(`✅ ${cuencasData.length} cuencas | ${proyectosData.length} proyectos | Actividades económicas corregidas`);
    </script>
</body>
</html>
